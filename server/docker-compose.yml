version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xingshuzi-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-MyStrongRootPassword123}
      - MYSQL_HOST=${MYSQL_HOST:-120.76.247.123}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DB=${MYSQL_DB:-xingshuzi}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key}
      - FLASK_PORT=5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/home/banners"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

