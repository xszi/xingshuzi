services:
  # Flask 应用服务
  # 注意：线上连接的是远程独立 MySQL（120.76.247.123），不使用本地 mysql 容器。
  # 数据库连接、密钥等通过同目录下的 .env 文件覆盖（见部署文档）。
  app:
    build: .
    container_name: xingshuzi-app
    restart: always
    ports:
      # 对外暴露 5001，与前端 NUXT_PUBLIC_API_BASE(:5001) 对齐；容器内仍是 5000
      - "5001:5000"
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DB=${MYSQL_DB}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://120.76.247.123:5001}
    networks:
      - xingshuzi-network
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./uploads:/app/uploads

networks:
  xingshuzi-network:
    driver: bridge
