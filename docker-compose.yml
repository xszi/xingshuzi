version: '3.8'

services:
  xingshuzi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xingshuzi
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    # 如果需要挂载卷
    # volumes:
    #   - ./logs:/app/logs
    networks:
      - app-network

networks:
  app-network:
    driver: bridge


