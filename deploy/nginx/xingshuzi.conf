# 行书子：Nginx 反向代理（Docker 内部网络）
# - /        -> Nuxt SSR (web:3000)
# - /api/*   -> Flask API (api:5000)
#
# 使用 HTTPS 时：
# 1) 先用 HTTP 启动跑通
# 2) 通过 certbot 申请证书到宿主机 /etc/letsencrypt
# 3) 解注释 443 server 段，并替换域名与证书路径

upstream xingshuzi_web {
  server web:3000;
  keepalive 32;
}

upstream xingshuzi_api {
  server api:5000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # Let’s Encrypt webroot（可选，如果你用 webroot 模式）
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://xingshuzi_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / {
    proxy_pass http://xingshuzi_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
  }
}

